<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 關鍵修改：加入這行 meta，解決 Google Drive 圖片破圖問題 -->
    <meta name="referrer" content="no-referrer">
    
    <title>社區行情即時查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f0f2f5; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
        .img-container { height: 220px; background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .agent-header { background: linear-gradient(to right, #ffffff, #f9fafb); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen pb-10">

    <!-- 1. 專業房仲名片區 -->
    <div class="w-full bg-white shadow-md z-20 agent-header sticky top-0">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center space-x-3">
            <div class="relative flex-shrink-0">
                <!-- 這裡也加上 no-referrer 以防萬一 -->
                <img id="agent-photo" referrerpolicy="no-referrer" src="https://via.placeholder.com/150?text=Agent" alt="房仲頭像" class="w-14 h-14 rounded-full border-2 border-blue-500 object-cover p-0.5 bg-white">
                <div class="absolute bottom-0 right-0 bg-green-500 w-3.5 h-3.5 rounded-full border-2 border-white"></div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center">
                    <h2 id="agent-name" class="text-lg font-bold text-gray-800 truncate">房產顧問</h2>
                    <span class="ml-2 text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold flex-shrink-0">專業認證</span>
                </div>
                <p class="text-xs text-gray-500 truncate mt-0.5">證號：<span id="agent-license">請填寫證號</span></p>
                <div class="mt-2 flex space-x-2">
                    <a id="btn-call" href="#" class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-xs font-bold flex items-center hover:bg-gray-200 transition">
                        <i class="fas fa-phone-alt mr-1.5 text-blue-600"></i> 致電
                    </a>
                    <a id="btn-line" href="#" target="_blank" class="bg-[#06c755] text-white px-3 py-1 rounded text-xs font-bold flex items-center hover:bg-[#05b34c] transition shadow-sm">
                        <i class="fab fa-line mr-1.5 text-lg"></i> 加LINE
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 主內容區 -->
    <div class="w-full max-w-md px-4 mt-4">
        <div class="text-center mb-5 mt-2">
            <h1 class="text-xl font-bold text-gray-800">🏠 社區行情快搜</h1>
            <p class="text-gray-400 text-xs mt-1">走到哪查到哪 • 實價登錄不求人</p>
        </div>

        <div id="status-area" class="bg-white rounded-xl shadow-lg p-6 text-center border border-gray-100">
            <div class="space-y-4">
                <button onclick="startGPS()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg text-lg flex items-center justify-center gap-2 transform active:scale-95 transition-all">
                    <i class="fas fa-map-marker-alt animate-bounce"></i> 顯示此地行情
                </button>
                <button onclick="showManualList()" class="w-full bg-white border-2 border-gray-200 text-gray-600 font-bold py-3 px-4 rounded-xl hover:bg-gray-50 flex items-center justify-center gap-2 transition">
                    <i class="fas fa-list"></i> 手動選擇社區
                </button>
            </div>
            <div id="loading" class="hidden mt-6"><div class="loader"></div><p class="text-sm text-gray-500 mt-2">衛星定位分析中...</p></div>
        </div>

        <div id="result-area" class="hidden bg-white rounded-xl shadow-lg overflow-hidden mt-4 border border-gray-100">
            <div class="img-container">
                <!-- 關鍵修改：加入 referrerpolicy="no-referrer" -->
                <img id="res-img" referrerpolicy="no-referrer" src="" alt="社區外觀" onerror="this.src='https://placehold.co/600x400/e2e8f0/94a3b8?text=No+Image'">
                <div class="absolute bottom-0 left-0 bg-gradient-to-t from-black/80 to-transparent w-full p-4 pt-12">
                    <h2 id="res-name" class="text-2xl font-bold text-white shadow-sm leading-tight">社區名稱</h2>
                </div>
            </div>

            <div class="p-5">
                <div class="grid grid-cols-2 gap-3 mb-5">
                    <div class="bg-red-50 p-3 rounded-lg text-center border border-red-100">
                        <p class="text-xs text-gray-500 mb-1">近半年均價</p>
                        <p id="res-price" class="text-lg font-bold text-red-600">-</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg text-center border border-gray-100">
                        <p class="text-xs text-gray-500 mb-1">近期最高</p>
                        <p id="res-max" class="text-lg font-bold text-gray-800">-</p>
                    </div>
                </div>

                <div class="bg-blue-50 rounded-lg p-4 mb-5 border border-blue-100">
                    <h3 class="text-xs font-bold text-blue-800 mb-2 flex items-center uppercase tracking-wide">
                        <i class="fas fa-calculator mr-2"></i>房貸試算 (利率2.2% / 8成)
                    </h3>
                    <div class="flex gap-2 text-sm mb-3">
                        <input type="number" id="calc-price" placeholder="輸入總價(萬)" class="w-2/3 p-2 border border-blue-200 rounded focus:outline-none focus:border-blue-500" oninput="calculateMortgage()">
                        <select id="calc-years" class="w-1/3 p-2 border border-blue-200 rounded text-gray-700" onchange="calculateMortgage()">
                            <option value="30">30年</option>
                            <option value="40">40年</option>
                            <option value="20">20年</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-end border-t border-blue-200 pt-
