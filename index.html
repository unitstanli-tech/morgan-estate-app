<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區行情即時查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

    <!-- 主卡片 -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden p-6 text-center z-10 relative">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🏠 房產行情即時通</h1>
        <p class="text-gray-500 text-sm mb-6">即時查詢本棟大樓成交實價</p>

        <!-- 狀態顯示區 -->
        <div id="status-area">
            <div class="space-y-4">
                <button onclick="startGPS()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg shadow text-lg flex items-center justify-center gap-2">
                    📍 顯示此地行情
                </button>
                <button onclick="showManualList()" class="w-full bg-white border-2 border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-2">
                    📋 手動選擇社區
                </button>
            </div>
        </div>

        <!-- 結果顯示區 -->
        <div id="result-area" class="hidden text-left mt-4">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4">
                <p class="text-sm text-blue-600 font-bold">您目前位於：</p>
                <h2 id="res-name" class="text-3xl font-bold text-gray-900">社區名稱</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-100 p-3 rounded text-center">
                    <p class="text-xs text-gray-500">近半年均價</p>
                    <p id="res-price" class="text-xl font-bold text-red-600">-</p>
                </div>
                <div class="bg-gray-100 p-3 rounded text-center">
                    <p class="text-xs text-gray-500">近期最高</p>
                    <p id="res-max" class="text-xl font-bold text-gray-800">-</p>
                </div>
            </div>

            <button onclick="openModal()" class="w-full bg-green-600 hover:bg-green-700 text-white text-center font-bold py-3 rounded-lg shadow animate-pulse">
                👀 查看隱藏/急售房源
            </button>
            
            <button onclick="location.reload()" class="mt-4 w-full text-gray-400 text-sm underline">重新查詢</button>
        </div>

        <!-- 手動選單區 -->
        <div id="manual-area" class="hidden mt-4 text-left">
            <p class="text-sm text-gray-500 mb-2">無法定位或距離太遠，請手動選擇：</p>
            <select id="manual-select" class="w-full p-3 border border-gray-300 rounded mb-4" onchange="manualSelect(this.value)">
                <option value="">-- 資料讀取中 --</option>
            </select>
            <button onclick="location.reload()" class="w-full text-gray-400 text-sm underline">返回</button>
        </div>

        <div id="loading" class="hidden"><div class="loader"></div><p class="text-sm text-gray-500">資料比對中...</p></div>
    </div>

    <!-- 隱藏 iframe -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showSuccess();}"></iframe>

    <!-- 模態視窗 -->
    <div id="form-modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50" onclick="closeModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6" id="form-content">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold">索取隱藏名單</p>
                    <div class="cursor-pointer z-50" onclick="closeModal()">
                        <svg class="fill-current text-black" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><path d="M14.53 4.53l-1.06-1.06L9 7.94 4.53 3.47 3.47 4.53 7.94 9l-4.47 4.47 1.06 1.06L9 10.06l4.47 4.47 1.06-1.06L10.06 9z"></path></svg>
                    </div>
                </div>
                <p class="text-sm text-gray-600 mb-4">請留下聯絡方式，系統將傳送 <span id="modal-community-name" class="font-bold text-blue-600"></span> 的詳細資料給您。</p>
                
                <form id="google-form" action="" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">您的稱呼 (必填)</label>
                        <input type="text" id="input-name" name="" required placeholder="王先生/林小姐" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">手機號碼 (必填)</label>
                        <input type="tel" id="input-phone" name="" required placeholder="09xx-xxx-xxx" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">LINE ID (選填)</label>
                        <input type="text" id="input-line" name="" placeholder="方便加Line聯繫" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <input type="hidden" id="input-community" name="" value="">
                    <div class="flex justify-end pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 bg-transparent p-3 rounded-lg text-indigo-500 hover:bg-gray-100 hover:text-indigo-400 mr-2">取消</button>
                        <button type="submit" class="px-4 bg-indigo-500 p-3 rounded-lg text-white hover:bg-indigo-400">送出索取</button>
                    </div>
                </form>
            </div>
            <div id="success-msg" class="hidden py-10 px-6 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                    <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900">索取成功！</h3>
                <p class="mt-2 text-sm text-gray-500">我已收到您的需求，會盡快將資料整理給您。</p>
                <button onclick="closeModal()" class="mt-6 w-full bg-gray-600 text-white py-2 rounded">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // 🔴 這裡我已經幫你填好 ID 了！
        // ==============================================
        
        // 你的 Sheet ID
        const sheetID = '1noafiQdpemIUXx2frQliBPXmn3btLj7e0IHOGorGRwE'; 
        
        // 自動組裝連結 (gviz/tq?tqx=out:csv 是關鍵)
        const googleSheetUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv`;

        // Google Form 設定
        const formActionURL = 'https://docs.google.com/forms/d/e/1FAIpQLScyIbqwIXcEc1c15WxECMbo2oY43YGCpUxibED4HS2k7_VgDQ/formResponse'; 
        
        const entryId_Name  = 'entry.1415901609';
        const entryId_Phone = 'entry.1276512542';
        const entryId_Line  = 'entry.1641674903';
        const entryId_Comm  = 'entry.1383846499';

        // ==============================================
        
        let allCommunities = [];
        let currentCommunityName = "";
        var submitted = false;

        document.getElementById('google-form').action = formActionURL;
        document.getElementById('input-name').name = entryId_Name;
        document.getElementById('input-phone').name = entryId_Phone;
        document.getElementById('input-line').name = entryId_Line;
        document.getElementById('input-community').name = entryId_Comm;

        window.onload = function() {
            // 這個檢查邏輯我改掉了，避免誤判
            if(sheetID === '這裡請填入你的SheetID') {
                alert("請記得在 index.html 裡填入你的 Google Sheet ID 喔！");
                return;
            }

            Papa.parse(googleSheetUrl, {
                download: true, header: true,
                complete: function(results) { 
                    allCommunities = results.data; 
                    console.log("資料已載入:", allCommunities); 
                    renderManualList(); 
                },
                error: function(err) {
                    console.error(err);
                    alert("讀取失敗！請確認：\n1. Google Sheet 已發布到網路\n2. Sheet ID: " + sheetID);
                }
            });
        };

        function startGPS() {
            document.getElementById('status-area').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            if (navigator.geolocation) navigator.geolocation.getCurrentPosition(successGPS, errorGPS);
            else { alert("不支援定位"); showManualList(); }
        }

        function successGPS(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            let found = null; 
            let minDist = Infinity;
            
            // 除錯資訊
            let debugMsg = "GPS 定位成功！\n您的位置: " + userLat.toFixed(4) + ", " + userLng.toFixed(4) + "\n\n";
            let hasData = false;

            allCommunities.forEach(item => {
                // 檢查是否有資料 (防呆機制)
                if(!item['緯度'] || !item['社區名稱']) return;
                hasData = true;
                
                const dist = getDistanceFromLatLonInKm(userLat, userLng, parseFloat(item['緯度']), parseFloat(item['經度'])) * 1000;
                const radius = parseFloat(item['偵測半徑']) || 100;
                
                debugMsg += item['社區名稱'] + " 距離: " + Math.round(dist) + "公尺\n";

                if (dist < radius && dist < minDist) { minDist = dist; found = item; }
            });

            document.getElementById('loading').classList.add('hidden');
            
            if (found) {
                showResult(found);
            } else {
                // 如果 Sheet 是空的，或者半徑設太小，都會進到這裡
                // ⚠️ 如果你確定功能正常了，可以把下面這行 alert 註解掉
                alert("附近無符合資料 (除錯模式)。\n" + debugMsg + "\n請在 Sheet 把「偵測半徑」改大一點測試。");
                showManualList(); 
            }
        }

        function errorGPS() {
            document.getElementById('loading').classList.add('hidden');
            alert("無法定位，請手動選擇");
            showManualList();
        }

        function showResult(data) {
            document.getElementById('status-area').classList.add('hidden');
            document.getElementById('manual-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');

            currentCommunityName = data['社區名稱'];
            document.getElementById('res-name').innerText = data['社區名稱'];
            document.getElementById('res-price').innerText = data['成交均價'];
            document.getElementById('res-max').innerText = data['近期最高'];
            
            document.getElementById('input-community').value = currentCommunityName;
            document.getElementById('modal-community-name').innerText = currentCommunityName;
        }

        function showManualList() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('status-area').classList.add('hidden');
            document.getElementById('manual-area').classList.remove('hidden');
        }

        function renderManualList() {
            const select = document.getElementById('manual-select');
            select.innerHTML = '<option value="">-- 請選擇社區 --</option>';
            allCommunities.forEach((item, index) => {
                if(!item['社區名稱']) return;
                const option = document.createElement('option');
                option.value = index; option.text = item['社區名稱'];
                select.appendChild(option);
            });
        }

        function manualSelect(index) {
            if(index === "") return;
            showResult(allCommunities[index]);
        }

        function openModal() {
            document.body.classList.add('modal-active');
            document.getElementById('form-modal').classList.remove('opacity-0', 'pointer-events-none');
        }
        function closeModal() {
            document.body.classList.remove('modal-active');
            document.getElementById('form-modal').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('form-content').classList.remove('hidden');
                document.getElementById('success-msg').classList.add('hidden');
                submitted = false;
            }, 300);
        }
        function showSuccess() {
            document.getElementById('form-content').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
            document.getElementById('google-form').reset();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1);
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }
    </script>
</body>
</html>
